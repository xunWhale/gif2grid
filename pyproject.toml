[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gif2grid"
version = "0.1.0"
description = "Turn animated images into timestamped contact sheets for vision models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xunWhale" }]
keywords = ["gif", "animation", "contact-sheet", "vision", "frames"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["Pillow>=9.0"]

[project.scripts]
gif2grid = "gif2grid.cli:main"

[tool.setuptools.packages.find]
include = ["gif2grid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
